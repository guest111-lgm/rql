[workspace]
members = ["crates/rql-core", "crates/rql-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/guest111-lgm/rql"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
dirs = "6.0"
oracledb = "=26.0.0-beta.2"
rpassword = "7.5"
rustyline = "18.0"
serde_json = "1.0"

